[package]
name = "ow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ow-core = { version = "0.0.0", path = "../ow-core" }
ow-egress = { version = "0.0.0", path = "../ow-egress" }
ow-proto = { version = "0.0.0", path = "../ow-proto" }
ow-vault = { version = "0.0.0", path = "../ow-vault" }
rustix = { version = "1.1.5", features = ["termios", "process", "fs", "stdio", "net"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
zeroize = "1.9.1"

[dev-dependencies]
ow-providers = { version = "0.0.0", path = "../ow-providers" }
rustix = { version = "1.1.5", features = ["pty", "fs"] }
owd = { version = "0.0.0", path = "../owd" }
tempfile = "3.27.0"
