name: fuzz
on:
  pull_request:
    paths: ["fuzz/**", "crates/ow-proto/**", "crates/ow-core/**", "crates/ow-vault/**"]
  schedule:
    - cron: "17 3 * * 1" # weekly
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: build all targets
        working-directory: fuzz
        run: cargo fuzz build
      - name: run each target (longer on the weekly schedule)
        if: github.event_name != 'pull_request'
        working-directory: fuzz
        run: |
          for t in frame_decoder request_parse grants_parse vault_open vault_payload; do
            cargo fuzz run "$t" -- -max_total_time=300
          done
      - name: short smoke run on pull requests
        if: github.event_name == 'pull_request'
        working-directory: fuzz
        run: |
          for t in frame_decoder request_parse grants_parse vault_open vault_payload; do
            cargo fuzz run "$t" -- -max_total_time=20
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
