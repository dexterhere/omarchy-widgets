[package]
name = "owd-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ow-proto = { path = "../crates/ow-proto" }
ow-core = { path = "../crates/ow-core" }
ow-vault = { path = "../crates/ow-vault" }
ow = { path = "../crates/ow" }
serde_json = "1"

# Not part of the main workspace: needs nightly and is built by its own CI job.
[workspace]

[[bin]]
name = "frame_decoder"
path = "fuzz_targets/frame_decoder.rs"
test = false
doc = false

[[bin]]
name = "request_parse"
path = "fuzz_targets/request_parse.rs"
test = false
doc = false

[[bin]]
name = "grants_parse"
path = "fuzz_targets/grants_parse.rs"
test = false
doc = false

[[bin]]
name = "vault_payload"
path = "fuzz_targets/vault_payload.rs"
test = false
doc = false

[[bin]]
name = "vault_open"
path = "fuzz_targets/vault_open.rs"
test = false
doc = false

[[bin]]
name = "admin_parse"
path = "fuzz_targets/admin_parse.rs"
test = false
doc = false

[[bin]]
name = "install_files"
path = "fuzz_targets/install_files.rs"
test = false
doc = false
