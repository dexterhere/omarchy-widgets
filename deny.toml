[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "NCSA", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Only `ow-egress` may reach the network (DECISIONS AUTH-EGRESS, AUTH-HTTP). A crate with
# `wrappers` may be depended on only by the listed crates; the others are banned outright.
# Not verified locally (cargo-deny is not installed here); CI is the first real run.
deny = [
    { crate = "ureq", wrappers = ["ow-egress"] },
    { crate = "ureq-proto", wrappers = ["ureq"] },
    { crate = "rustls", wrappers = ["ow-egress", "ureq"] },
    { crate = "rustls-webpki", wrappers = ["rustls"] },
    { crate = "webpki-roots", wrappers = ["ureq"] },
    { crate = "httparse", wrappers = ["ureq", "ureq-proto"] },
    { crate = "rustls-native-certs" },
    { crate = "rustls-platform-verifier" },
    { crate = "tokio-rustls" },
    { crate = "hyper-rustls" },
    { crate = "native-tls" },
    { crate = "tokio-native-tls" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "hyper" },
    { crate = "hyper-util" },
    { crate = "reqwest" },
    { crate = "isahc" },
    { crate = "curl" },
    { crate = "curl-sys" },
    { crate = "attohttpc" },
    { crate = "minreq" },
    { crate = "surf" },
    { crate = "h2" },
    { crate = "socket2" },
    { crate = "mio" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
