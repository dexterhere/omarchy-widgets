name: fuzz
on:
  pull_request:
    paths: ["fuzz/**", "crates/ow-proto/**", "crates/ow-core/**", "crates/ow-vault/**"]
  schedule:
    - cron: "17 3 * * 1" # weekly
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch tip, resolved 2026-10-23
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: build all targets
        working-directory: fuzz
        run: cargo fuzz build
      - name: run each target (longer on the weekly schedule)
        if: github.event_name != 'pull_request'
        working-directory: fuzz
        run: |
          for t in frame_decoder request_parse grants_parse vault_open vault_payload; do
            cargo fuzz run "$t" -- -max_total_time=300
          done
      - name: short smoke run on pull requests
        if: github.event_name == 'pull_request'
        working-directory: fuzz
        run: |
          for t in frame_decoder request_parse grants_parse vault_open vault_payload; do
            cargo fuzz run "$t" -- -max_total_time=20
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
